name: Build and Publish

on:
  push:
    branches-ignore:
      - nightly
    # Pushing a version tag is the whole release: the jobs below build every
    # platform and tag-release publishes them. Nothing needs doing by hand.
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

defaults:
  run:
    # Use Nix for all of our build commands.
    # Doing this will automatically run everything in our devShell.
    shell: nix develop -c bash -e {0}

jobs:
  generate:
    name: Run go generate
    runs-on: ubuntu-latest
    needs: gomod # avoid pushing at the same time as gomod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Generate
        run: go generate ./...

      - name: Commit changes
        uses: ./.github/actions/push-or-fail
        with:
          commit-message: Run go generate


  gomod:
    name: Validate Go modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Tidy up Go modules
        run: go mod tidy

      - name: Update gomod2nix.toml
        run: gomod2nix --outdir nix

      # The Flatpak build is offline, so its Go modules are pinned sources
      # that must track go.sum exactly as gomod2nix.toml does.
      - name: Update Flatpak Go sources
        run: go mod download && python3 packaging/flatpak/gen-go-sources.py

      - name: Commit changes
        uses: ./.github/actions/push-or-fail
        with:
          commit-message: Tidy up Go modules
          file-pattern: nix/gomod2nix.toml go.mod go.sum packaging/flatpak/go-sources.json


  lint:
    name: Lint
    needs: [gomod, generate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Format
        run: |
          fail=
          go list -f '{{ .Dir }}' | while read -r d; do
            goimports -l "$d" | while read -r f; do
              fail=1
              printf "::error file=%s::%s\n" "$d/$f" "File is not formatted"
            done
          done
          [[ -z "$fail" ]]

      - name: Vet
        run: go vet ./... |& workflowify -e -t vet

      - name: Staticcheck (warnings)
        run: nix run .#staticcheck ./... || true |& workflowify -w -t staticcheck

      - name: Test
        run: go test -v ./...


  build-source:
    name: Build source tarball
    needs: [gomod, generate]
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.build.outputs.name }}
      directory: ${{ steps.build.outputs.directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build
        id: build
        run: |
          nix build --file ./. lib.mkSource \
            --argstr version "$(git-version)"

          echo name=$(ls result) >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: result


  build-linux:
    name: Build for Linux (via Nix)
    needs: [gomod, generate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build
        id: build
        run: |
          nix build --file ./. lib.mkPackageCross \
            --argstr version "" \
            --argstr target  "${{ matrix.target }}"

          echo name=$(ls result) >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: result


  build-windows:
    name: Build for Windows
    needs: [gomod, generate]
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Build using MSYS2
        uses: ./.github/actions/build-msys2-app
        with:
          msys-dependencies: |
            mingw-w64-x86_64-gcc 
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-gobject-introspection
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-go
          out-path: ${{ runner.temp }}/exe
          exe-name: lildisc.exe
          build-tags: nogtksource

      - name: Prepare
        id: prepare
        run: |
          version=$(.github/tools/git-version)

          # version is usually in the format vMAJOR.MINOR.PATCH-N-HASH, while
          # Advanced Installer only allows format MAJOR.MINOR.PATCH.REVISION.
          # We trim out our hash, trim the leading v, and replace the first - with a .
          if [[ $version =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?) ]]; then
            version=${BASH_REMATCH[1]}
            version=${version//-/.}
          else
            # Use some fallback version. Realistically, this should never
            # happen, so we throw a warning.
            version=0.0.0.999
            echo '::warning::Could not determine version from git for Windows build. Using `$version`'
          fi

          cat<<EOF >> "$GITHUB_OUTPUT"
          version=$version
          name=lildisc-windows-amd64
          EOF

      - name: Make MSI installer
        uses: ./.github/actions/make-advinst-app
        with:
          aip-file: nix/lildisc-windows.aip
          exe-directory: ${{ runner.temp }}/exe
          exe-name: lildisc.exe
          app-name: LilDisc
          app-version: ${{ steps.prepare.outputs.version }}
          icon-file: internal/icons/windows/lildisc.ico
          out-path: result
          out-name: ${{ steps.prepare.outputs.name }}.msi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.name }}
          path: result


  build-macos:
    name: Build for macOS (experimental)
    needs: [gomod, generate]
    runs-on: macos-latest
    # Never blocks a release. This build has not been run on real hardware and
    # macOS is not a supported platform: the system tray and notifications go
    # through D-Bus, which does not exist there, and the artifact is a bare
    # binary that still needs Homebrew's GTK at runtime rather than a bundled
    # .app. It is here to find out whether the code still compiles on Darwin,
    # not to ship a macOS release.
    continue-on-error: true
    defaults:
      run:
        # Override the workflow-level `nix develop` shell: this job builds
        # against Homebrew.
        shell: bash -e {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GTK
        run: brew install gtk4 libadwaita gobject-introspection pkg-config

      - name: Build
        id: build
        run: |
          # Name each formula's own pkgconfig directory rather than relying on
          # Homebrew's shared prefix: libffi, which gobject-introspection
          # requires, is keg-only, and a formula that failed to link would
          # otherwise be invisible to pkg-config.
          for f in gobject-introspection libffi glib gtk4 libadwaita; do
            PKG_CONFIG_PATH="$(brew --prefix "$f")/lib/pkgconfig:$PKG_CONFIG_PATH"
          done
          export PKG_CONFIG_PATH="$PKG_CONFIG_PATH:$(brew --prefix)/lib/pkgconfig"

          # Fail here, with pkg-config's reasons, rather than deep in cgo.
          if ! pkg-config --modversion gobject-introspection-1.0 gtk4 libadwaita-1; then
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
            ls "$(brew --prefix gobject-introspection)/lib/pkgconfig" || true
            pkg-config --debug --exists gobject-introspection-1.0 2>&1 | tail -20
            exit 1
          fi

          mkdir -p result

          # nogtksource drops the GtkSourceView composer and gspell checking,
          # exactly as the Windows build does, so gtk4 and libadwaita are the
          # only Homebrew dependencies needed.
          # Name the file for its platform: releases attach files by their
          # own name, so a bare "lildisc" gave no hint it was for macOS.
          name="lildisc-macos-$(uname -m)"
          go build -tags nogtksource -o "result/$name" .

          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: result


  tag-release:
    name: Publish release for tag
    needs: [build-source, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    concurrency:
      group: tag-release-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        # Plain bash: this job only moves files around and needs no devShell.
        shell: bash -e {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - name: Collect built artifacts
        run: mkdir /tmp/bin && find /tmp/artifacts -type f -exec mv {} /tmp/bin/ \;

      - name: Read the tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          # Checkout can leave a lightweight copy of an annotated tag; fetch
          # the real one so its message is readable.
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"

          # An annotated tag's subject becomes the release title and its body
          # the notes. A lightweight tag gets the tag name and generated notes.
          title=$(git tag -l --format='%(contents:subject)' "$tag")
          git tag -l --format='%(contents:body)' "$tag" > /tmp/notes.md
          [ -n "$title" ] || title="LilDisc $tag"

          prerelease=false
          [[ "$tag" == *-* ]] && prerelease=true

          {
            echo "title=$title"
            echo "prerelease=$prerelease"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.tag.outputs.title }}
          body_path: /tmp/notes.md
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.tag.outputs.prerelease != 'true' }}
          files: /tmp/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Record the release in the AppStream metainfo on the default branch.
      # This used to be a separate workflow triggered by publishing a
      # release, which never fires for releases created by this token.
      - name: Update metainfo on the default branch
        if: steps.tag.outputs.prerelease != 'true'
        run: |
          git checkout "${{ github.event.repository.default_branch }}"
          git pull --ff-only
          python3 .github/tools/update-metainfo.py \
            "${{ steps.tag.outputs.version }}" \
            "$(date -u +%Y-%m-%d)" \
            "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Record ${{ github.ref_name }} in metainfo"
          git push


  auto-release:
    name: Publish release for master
    needs: [build-source, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    concurrency:
      group: auto-release-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        # Plain bash: this job only moves files around and needs no devShell.
        shell: bash -e {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - name: Collect built artifacts
        run: mkdir /tmp/bin && find /tmp/artifacts -type f -exec mv {} /tmp/bin/ \;

      - name: Compute version
        id: version
        run: |
          # Date-based, because the repository carries no semver tags to count
          # from — `git describe` would otherwise produce names derived from
          # the rolling `nightly` tag. The run number keeps same-day pushes
          # distinct and always increasing.
          echo "tag=v$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LilDisc ${{ steps.version.outputs.tag }}
          body: |
            Automatic release built from `master` (${{ github.sha }}).
          generate_release_notes: true
          # Builds of every master push are pre-releases, so a pushed version
          # tag (tag-release above) is always the one marked latest.
          prerelease: true
          make_latest: false
          files: /tmp/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  nightly-release:
    name: Update nightly release
    needs: [build-source, build-linux, build-windows, build-macos]
    environment: Nightly release
    runs-on: ubuntu-latest
    # Superseded by auto-release above, which publishes a real versioned
    # release on every master push. Left in place but disabled rather than
    # deleted, so the rolling `nightly` tag and its download links stay valid.
    if: false
    concurrency:
      group: nightly-${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - name: Collect built artifacts
        run: mkdir /tmp/bin && find /tmp/artifacts -type f -exec mv {} /tmp/bin/ \;

      - name: Generate Nightly release notes
        id: generate-notes
        run: |
          versionJSON=$(nightly-info)
          version() { jq -r ".$1" <<< "$versionJSON"; }

          body=$(cat<<EOF
          This is a nightly release of LilDisc. It is built from the latest
          commit on the `main` branch.

          **Warning:** This release is not guaranteed to be stable and may
          contain bugs. Use at your own risk. Please report any issues you
          encounter as separate GitHub Issues.

          ### Version Information

          - LilDisc: $(version lildisc)
          - Go: $(version go)
          - GTK: $(version gtk4)
          - Libadwaita: $(version libadwaita1)
          EOF)

          echo "body=$(jq --null-input --arg body "$body" '$body')" >> $GITHUB_OUTPUT
        env:
          VERSIONS: ${{ needs.build.outputs.versions }}

      - name: Update Nightly release
        uses: andelf/nightly-release@ce2d0a30db8cf9f3920a4237d6a0b874400710c1
        with:
          name: Nightly Release
          body: ${{ fromJSON(steps.generate-notes.outputs.body) }}
          tag_name: nightly
          prerelease: true
          files: /tmp/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

