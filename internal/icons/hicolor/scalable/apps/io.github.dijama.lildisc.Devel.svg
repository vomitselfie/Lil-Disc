<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Blurple MiniDisc (development build)</title>
  <desc id="desc">A dark MiniDisc cartridge with a visible lavender disc, silver sliding shutter, and blurple label. Transparent background.</desc>
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E0E3FF"/>
      <stop offset=".45" stop-color="#929AF8"/>
      <stop offset=".65" stop-color="#E0E3FF"/>
      <stop offset="1" stop-color="#5865F2"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#B6BCD5"/>
      <stop offset=".4" stop-color="#F2F3FF"/>
      <stop offset="1" stop-color="#C8CCE3"/>
    </linearGradient>
    <pattern id="devel-stripes" patternUnits="userSpaceOnUse" width="24" height="24" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#FFFFFF"/>
    </pattern>
    <clipPath id="shell">
      <path d="M44 22H193L234 63V216Q234 234 216 234H40Q22 234 22 216V44Q22 22 44 22Z"/>
    </clipPath>
  </defs>
  <!-- Clipped upper corner and molded cartridge shell. -->
  <path d="M44 22H193L234 63V216Q234 234 216 234H40Q22 234 22 216V44Q22 22 44 22Z" fill="#17181F"/>
  <path d="M44 26H191L230 65V211Q230 229 212 229H44Q26 229 26 211V44Q26 26 44 26Z" fill="#2B2D39"/>
  <path d="M42 35H185L220 70" fill="none" stroke="#515465" stroke-width="3" stroke-linecap="round"/>
  <!-- Disc seen through the cartridge window. -->
  <circle cx="118" cy="111" r="73" fill="#17181F"/>
  <circle cx="118" cy="111" r="66" fill="url(#disc)"/>
  <circle cx="118" cy="111" r="58" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="2"/>
  <path d="M118 111 65 78A63 63 0 0 1 92 54Z" fill="#FFFFFF" opacity=".28"/>
  <path d="M118 111 157 161A63 63 0 0 1 135 172Z" fill="#5865F2" opacity=".35"/>
  <circle cx="118" cy="111" r="23" fill="#E0E3FF"/>
  <circle cx="118" cy="111" r="15" fill="#777E9E"/>
  <circle cx="118" cy="111" r="8" fill="#17181F"/>
  <!-- Sliding metal shutter and its inset access slot. -->
  <path d="M154 26H190L218 54V173Q218 179 212 179H160Q154 179 154 173Z" fill="#17181F" opacity=".35" transform="translate(-3 3)"/>
  <path d="M156 26H190L218 54V171Q218 177 212 177H162Q156 177 156 171Z" fill="url(#metal)"/>
  <path d="M164 35V166" stroke="#FFFFFF" stroke-opacity=".65" stroke-width="2"/>
  <rect x="179" y="62" width="23" height="81" rx="7" fill="#737A97"/>
  <rect x="183" y="66" width="15" height="73" rx="4" fill="#232530"/>
  <path d="M177 157H203M177 162H203" stroke="#949BB8" stroke-width="2" stroke-linecap="round"/>
  <!-- Writable label with small music bars. -->
  <rect x="39" y="185" width="178" height="32" rx="5" fill="#5865F2"/>
  <path d="M53 199H139M53 206H112" stroke="#E0E3FF" stroke-width="3" stroke-linecap="round"/>
  <path d="M169 205V198M177 208V193M185 205V197M193 208V194M201 204V199" stroke="#E0E3FF" stroke-width="3" stroke-linecap="round"/>
  <rect x="36" y="53" width="5" height="18" rx="2" fill="#5865F2"/>
  <circle cx="37" cy="222" r="2" fill="#71768C"/>
  <circle cx="219" cy="222" r="2" fill="#71768C"/>
  <!-- Development-build marker: diagonal stripes across the cartridge. -->
  <rect x="0" y="0" width="256" height="256" fill="url(#devel-stripes)" opacity=".18" clip-path="url(#shell)"/>
</svg>
